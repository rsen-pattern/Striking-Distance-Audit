[theme]
base = "dark"
backgroundColor = "#0f0f11"
secondaryBackgroundColor = "#1a1a1f"
textColor = "#e8e6e0"
primaryColor = "#c8ff6e"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 500          # MB — large Screaming Frog / Semrush exports
maxMessageSize = 500         # MB — large responses back to browser

[browser]
gatherUsageStats = false

[runner]
# Disable the "are you still there?" idle warning that disconnects long audits
fastReruns = true
